
services:
  - type: web
    name: alexcandyenterprice
    runtime: python
    plan: free

    buildCommand: >-
      cd frontend &&
      npm ci &&
      npm run build &&
      cd ../backend &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input

    startCommand: >-
      cd backend &&
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://alexcandyenterprice.onrender.com"

      - key: VITE_API_BASE_URL
        value: "/api"

      - key: VITE_WHATSAPP_NUMBER
        sync: false

      - key: DATABASE_URL
        sync: false
