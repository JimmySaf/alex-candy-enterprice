
services:
  - type: web
    name: alexcandyenterprice
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://alexcandyenterprice.onrender.com"

      - key: VITE_API_BASE_URL
        value: "/api"

      - key: VITE_WHATSAPP_NUMBER
        sync: false

      - key: DATABASE_URL
        sync: false
